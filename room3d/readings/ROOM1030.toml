# Mansion 1F "F passage": green damask corridor. West leg, a stub east, a
# wider hall at the north-west corner, the passage running east and the pocket
# south off its end. The papered walls stand outside the RDT collision blocks
# (by ~400-600 on the sides, more at some ends): walls were placed from floor
# picks on the originals, so cameras disagree by a few hundred units here and
# there. Doors: the far south end, two on the west wall (cam0, cam3), one on
# the stub's north wall near its end (cam2) and one on the pocket's west wall
# (cam6).
