# Mansion dining room. Shell from ROOM1050.RDT blocks 0,3,4,7; table from
# block 8; chairs from circles 9,11,13,14,19-22; columns from circles 1,6,10,18;
# fireplace from block 16; urn from circle 15; corner cabinets blocks 5, 17.
# Gallery on all four sides (red runner on its floor, seen from cam0), arches
# on columns at both ends, stained-glass window above the west gallery
# (cam2). Tapestries and shield are flat approximations; cam6 is the shield
# close-up and keeps the original background.
room = "ROOM1050"
title = "Dining room"
seed = 1050
backdrop = [6]

