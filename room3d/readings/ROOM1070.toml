# Art room: a dark blue-grey gallery with the jade statue (a woman carrying a
# vase on her head) on a tall dark-green marble pedestal, paintings under
# spotlights, a red-curtained doorway east and a wooden door south of it;
# beyond the curtain a red-walled passage and, north of it past a slim
# column, the red storeroom with a curio cabinet across its west end, busts
# and paintings leaning on its south wall.
# Gallery from ROOM1070.RDT blocks 8,14,15,17 (east wall pushed out to where
# cams 1/2 put it); pedestal from block 18; statue heights from cams 0/1.
# Passage from blocks 4,5,16; the column is circle 7; the storeroom's east
# half from blocks 4,5,6 (cam5), its west half and the cabinet from floor
# picks on cam6 (wider than the collision, which stops at the cabinet front).
# The statue is stacked cylinders, not a figure; the rolled carpet lying on
# the storeroom floor is left out.
room = "ROOM1070"
title = "Art room"
seed = 1070

[shell]
floor = 0
ceiling = -5600
floor_material = "marble.blue"
wall_material = "plaster.blue"
ceiling_material = "plaster.night"
skirting = 200
trim = "marble_dark"
cell = 800

[materials]
