# Wallpapered corridor loop east of ROOM10A0: a west leg with the NW corner
# taken by solid block 3 (a narrow gap runs north past it), a north passage,
# an east riser between blocks 2 and 0, a south passage and an east leg
# running south to a door. Zones are the ROOM1090.RDT collision gaps pushed
# out ~450 to the visual walls (floor picks in cams 5/6 put the walls there).
# Doors and paintings placed by projecting them into the views. The original
# far walls of cams 3/4 sit higher in frame than the projection allows, so
# the far ends of those two views stay approximate.
room = "ROOM1090"
title = "1F east passage"
seed = 1090

[shell]
floor = 0
ceiling = -5000
floor_material = "planks"
wall_material = "wallpaper"
ceiling_material = "plaster"
skirting = 300
cell = 700

[materials]
wallpaper = { color = [0.70, 0.68, 0.56], motif = [0.50, 0.49, 0.38], repeats = 5 }
planks = [0.34, 0.16, 0.10]
plaster = [0.42, 0.40, 0.33]
wood = [0.26, 0.16, 0.10]
door = [0.28, 0.17, 0.10]

[lighting]
ambient = [0.40, 0.39, 0.31]

[[zone]]            # west leg (south of block 3)
box = [1500, 6280, 7630, 10900]
[[zone]]            # gap north past block 3
box = [5350, 10900, 7630, 12940]
[[zone]]            # north passage
box = [5350, 12940, 16674, 15300]
floor_along = "x"
[[zone]]            # east riser between blocks 2 and 0
box = [14310, 8790, 16674, 12940]
[[zone]]            # south passage
box = [14310, 6280, 25740, 8790]
floor_along = "x"
[[zone]]            # east leg; tall ceiling so cam1 (above the 5000 line) sees walls
box = [21100, 1300, 25740, 6280]
ceiling = -7900

[[door]]            # cam0: end of the east leg
wall = "south"
span = [23300, 25450]
top = -3400
material = "door"
[[door]]            # cam1: east wall of the south passage
wall = "east"
span = [6700, 8600]
top = -3400
material = "door"
[[door]]            # cams 6/7: block 2's west face, facing the west leg
wall = "east"
line = 7630
span = [8400, 10500]
top = -3400
material = "door"
[[door]]            # cam6: west wall of the west leg
wall = "west"
span = [8000, 10400]
top = -3400
material = "door"
[[door]]            # cam3: block 0's south face, beside the riser
wall = "north"
span = [17200, 18600]
top = -3400
material = "door"

[[painting]]        # cam5/cam4: pink sunset on the west end of the north passage
wall = "west"
span = [11800, 14400]
y = [-4100, -2300]
[[painting]]        # cam2/cam0 far end: small painting on the south passage
wall = "south"
span = [18800, 21000]
y = [-4000, -2600]

[[sconce]]          # cam4: right wall near
wall = "north"
at = [-3800, 15600]
candles = 1
strength = 0.40
reach = 3200
[[sconce]]          # cam3/cam7 far: north passage north wall
wall = "north"
at = [-3800, 8500]
candles = 1
strength = 0.40
reach = 3200
[[sconce]]
wall = "north"
at = [-3800, 12000]
candles = 1
strength = 0.40
reach = 3200
[[sconce]]          # cam1: east leg east wall
wall = "east"
at = [-3500, 4200]
candles = 1
strength = 0.40
reach = 3200
[[sconce]]          # cam6: south passage
wall = "south"
at = [-3500, 17000]
candles = 1
strength = 0.40
reach = 3200

# The landscape on the riser's west wall (block 2's east face): painting
# entries take their wall from the widest zone, so it is a framed canvas box.
[[object]]
kind = "box"
box = [14310, 9900, 14370, 12300]
top = -4000
bottom = -2200
material = "wood"
[[object]]
kind = "box"
box = [14370, 10000, 14400, 12200]
top = -3900
bottom = -2300
material = "painting"
