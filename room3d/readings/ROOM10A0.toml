# Mansion 1F corridor south of the right stairs: an L of olive damask
# wallpapered passage. Zones are the ROOM10A0.RDT collision gaps (blocks
# 0,1,2,3,5) pushed out ~450 to the visual walls; cams 0-3 stand right
# against the south wall, so the collision line would cut through them.
# Doors and paintings placed by projecting them into the views: the dark
# stairs door is the west one on the north wall (cam1), the pale one the
# east one (cam0).
room = "ROOM10A0"
title = "1F east corridor"
seed = 100

[shell]
floor = 0
ceiling = -5300
floor_material = "planks"
wall_material = "wallpaper"
ceiling_material = "plaster"
skirting = 240
chair_rail = false
cell = 700

[materials]
wallpaper = { color = [0.27, 0.28, 0.15], motif = [0.56, 0.42, 0.22], repeats = 2 }
planks = [0.30, 0.17, 0.10]
plaster = [0.30, 0.27, 0.18]
wood = [0.24, 0.14, 0.09]
door = [0.26, 0.15, 0.09]
"door.pale" = { color = [0.50, 0.56, 0.58], rows = 3 }

[lighting]
ambient = [0.13, 0.12, 0.08]

[[zone]]            # east-west passage
box = [1386, 1548, 16452, 5708]
floor_along = "x"
[[zone]]            # north leg
box = [1386, 5708, 4041, 13698]

[[door]]            # cam1 near right: dark door with a plaque, north wall
wall = "north"
span = [7800, 9300]
top = -3800
material = "door"
[[door]]            # cam0 left: pale door, north wall
wall = "north"
span = [10600, 12600]
top = -3900
material = "door.pale"
[[door]]            # cam0 far end: east end
wall = "east"
span = [2300, 4900]
top = -3600
material = "door"
[[door]]            # cam2 left / cam1 far left: south wall near the west end
wall = "south"
span = [1900, 4100]
top = -3600
material = "door"
[[door]]            # cam4 left / cam3 far left: west wall of the north leg
wall = "west"
span = [10600, 12900]
top = -3800
material = "door"

[[painting]]        # cam2: large painting on the south wall
wall = "south"
span = [4400, 6700]
y = [-4300, -2200]

[[sconce]]
wall = "south"
at = [-3600, 9600]
candles = 1
strength = 0.42
reach = 3200
[[sconce]]          # cam1: right of the far door
wall = "north"
at = [-3600, 6800]
candles = 1
strength = 0.32
reach = 3000
[[sconce]]          # cam0: right wall, near the camera's line
wall = "south"
at = [-3800, 12600]
candles = 1
strength = 0.36
reach = 3000
[[sconce]]          # cam3/cam4: north leg east wall
wall = "east"
at = [-3800, 11000]
candles = 1
strength = 0.36
reach = 3000
