# Mansion 1F greenhouse: ivy-hung ochre plaster, grimy stone tiles, a square
# pond with a brass fountain, a planter bed of tall plants, slatted benches on
# the south wall. The whole west wall is the dark aquarium window with the
# shield hanging behind the glass. The north-east corner (block 0) juts out;
# the door is on its west face, the two garden windows are on the east wall,
# and the water pump (block 5) stands in the corner between them.
# From ROOM10C0.RDT blocks 0-8, cameras 0-4 and the mask records; the plants,
# hoses and the bust inside the aquarium are left out.
room = "ROOM10C0"
title = "Greenhouse"
seed = 1200

[shell]
floor = 0
ceiling = -4800
floor_material = "stone.tiles"
wall_material = "plaster"
