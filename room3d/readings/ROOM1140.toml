# Boiler terrace behind the mansion: stone paving with a low parapet and an
# iron railing on the open south and west sides, ivy-covered brick on the
# building faces, the copper still on its brick base and barrels at the east
# end, the walkway running on north (the RDT has no door record here). The cameras hang outside the
# railing over the drop, so the open sides are drop zones with the forest
# beyond, not walls.
room = "ROOM1140"
title = "Boiler terrace"
seed = 2000

[shell]
floor = 0
ceiling = -20000
floor_material = "rock.paving"
wall_material = "forest"
ceiling_material = "sky"
skirting = 0
trim = "stone"
cell = 1200

[materials]
"rock.paving" = { color = [0.36, 0.36, 0.32], tile = [2600, 2600], slabs = 26, moss = 0.3 }
"brick.ivy" = { color = [0.40, 0.33, 0.20], ivy = 0.6, tile = [2000, 1200] }
stone = [0.62, 0.62, 0.58]
wood = [0.26, 0.10, 0.08]
door = [0.30, 0.20, 0.12]

[lighting]
ambient = [0.22, 0.24, 0.22]

[[zone]]            # walkway north to the door; its east side is the brick building
box = [7578, 12886, 10764, 24570]
wall_materials = { east = "brick.ivy", north = "brick.ivy" }
[[zone]]            # east terrace up to the building's south face (the still stands on it)
box = [10764, 12886, 19710, 15678]
floor_along = "x"
wall_materials = { north = "brick.ivy", east = "brick.ivy" }
[[zone]]            # the drop south of the parapet (all four cameras hang out here)
box = [1098, 8694, 22614, 12886]
open_floor = true
depth = 6000
shaft_material = "brick.ivy"
[[zone]]            # the drop west of the walkway parapet
box = [1098, 12886, 7578, 24570]
open_floor = true
depth = 6000
shaft_material = "brick.ivy"

[[slab]]            # wooded ground far below
box = [1098, 8694, 22614, 12886]
top = 6000
thickness = 100
top_material = "hedge"
bottom_material = "hedge"
[[slab]]
box = [1098, 12886, 7578, 24570]
top = 6000
thickness = 100
top_material = "hedge"
bottom_material = "hedge"


