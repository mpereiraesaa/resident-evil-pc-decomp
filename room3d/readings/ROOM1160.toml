# (block 2) with the red tapestry hung over it, a potted palm in the
# north-west corner (circle 6), the door at the west end of the north wall,
# the low oval coffee table (three overlapping circles 3/7/8), the long
# grey-purple sofa backed to the south (block 4), a pedestal lamp stand in
# the south-east corner (circle 5), paintings on the east and north walls
# and the white-globed chandelier. Rug extent and the table height are
# read off camera 0 and are approximate.
