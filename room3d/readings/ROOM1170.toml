# Large gallery: a U-shaped loop round a central wall (block 4) that runs
# from the west wall to the east connection. Brown plaster over an ornamented
# olive dado, red planks. The paintings all hang on the central wall's two
# faces (north face: the big angel canvas, two more further east; south
# face: the deep-framed canvas, its neighbour and two ovals), placed from the
# original views by projecting their corners onto the face planes. The
# builder's [[painting]] always picks the outer wall when zones overlap
# along a side, so these are thin boxes (canvas + brass frame) set on the
# central wall faces. A small dark hatch sits high on the west wall. The
# domed painted ceiling, the spotlight rails and the corner pilasters are
# not modelled; ovals are drawn rectangular and the canvases are mottled
# gold/brown plaster rather than pictures. Camera 7 is all angel canvas
# and keeps the original background.
room = "ROOM1170"
title = "Large gallery"
seed = 2300
backdrop = [7]           # the angel canvas filling the frame: keep the original

[shell]
floor = 0
ceiling = -5000
floor_material = "planks"
wall_material = "plaster"
ceiling_material = "plaster.dark"
dado = 1300
dado_material = "panel.olive"
