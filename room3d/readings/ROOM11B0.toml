# Mansion storeroom (to the courtyard): a tall whitewashed stone room with a
# timber frame band (dark posts, pale infill panels) high under the ceiling,
# green flagstones, the tool shelf high on the south wall with tools hung
# under it, barrels (circles 0, 5, 6), a low crate in the north-west corner
# (block 4), the plain door west and the big double door east. Heights are
# from projecting the band, shelf and door tops onto the wall planes (the
# room is taller than it looks: ceiling about -6600).
room = "ROOM11B0"
title = "Mansion storeroom"
seed = 2700

[shell]
floor = 0
ceiling = -6600
floor_material = "rock.flag"
wall_material = "plaster"
ceiling_material = "planks.ceiling"
skirting = 200
cell = 700

[materials]
plaster = { color = [0.62, 0.62, 0.60], stains = 0.6 }
"plaster.infill" = { color = [0.72, 0.72, 0.70], stains = 0.2 }
"rock.flag" = { color = [0.17, 0.22, 0.19], tile = [3000, 3000], slabs = 22, moss = 0.0 }
"planks.ceiling" = { color = [0.22, 0.16, 0.12], count = 10 }
wood = [0.30, 0.18, 0.10]
"wood.post" = [0.12, 0.08, 0.06]
"crate.shelf" = [0.36, 0.26, 0.16]
door = [0.26, 0.14, 0.08]
double_door = [0.40, 0.22, 0.12]

[lighting]
