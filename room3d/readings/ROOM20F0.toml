# Small dining room: grey-blue painted plank walls over a brown dado, dark
# planks with a patterned rug, a long table with chairs along x, plates and a
# clock on the east wall, a tall cabinet in the north-east corner, an open
# wall shelf high on the west wall. A doorway in the south wall leads into a
# side alcove with a red glazed cabinet at its west end. Table, rug, ceiling
# height and the doorway cast from cameras 0, 1 and 2 with floor picking;
# the plates are approximated as small square porcelain panels.
room = "ROOM20F0"
title = "Small dining room"
seed = 2150

[shell]
floor = 0
ceiling = -5700
floor_material = "planks"
wall_material = "planks.wall"
ceiling_material = "plaster.dark"
dado = 1100
dado_material = "panel"
chair_rail = true
skirting = 120
cell = 700

[materials]
"planks.wall" = { color = [0.52, 0.58, 0.60], count = 12 }
"plaster.dark" = [0.24, 0.24, 0.22]
panel = [0.40, 0.26, 0.12]
planks = [0.26, 0.16, 0.10]
wood = [0.26, 0.14, 0.08]
door = [0.22, 0.13, 0.08]
carpet = { color = [0.56, 0.30, 0.22], motif = [0.80, 0.64, 0.42] }
"wood.red" = [0.46, 0.10, 0.08]
velvet = [0.30, 0.18, 0.10]

[lighting]
ambient = [0.12, 0.13, 0.13]

[[zone]]            # main room
box = [3478, 5130, 11736, 12168]
[[zone]]            # passage through the south doorway
box = [7344, 3834, 8676, 5130]
[[zone]]            # side alcove
box = [4446, 1926, 8676, 3834]

[[door]]            # the room's door, north wall near the west corner
wall = "north"
span = [3700, 5000]
top = -3700
material = "door"

[[object]]
kind = "rug"
box = [4200, 6400, 10900, 10780]
[[object]]          # long table along x (block 2 also covers the chairs)
kind = "table"
box = [5500, 7900, 9400, 9600]
top = -1300
thickness = 120
[[object]]
kind = "chair"
at = [6500, 7400]
facing = "north"
[[object]]
kind = "chair"
at = [8500, 7400]
facing = "north"
[[object]]
kind = "chair"
at = [6500, 10100]
facing = "south"
[[object]]
kind = "chair"
at = [8500, 10100]
facing = "south"
[[object]]          # tall cabinet in the north-east corner (block 3)
kind = "box"
box = [10300, 11300, 11736, 12168]
top = -3800
material = "wood"
omit = ["bottom", "north", "east"]
[[object]]          # red glazed cabinet at the west end of the alcove
kind = "box"
box = [4446, 2100, 5050, 3650]
top = -3200
material = "wood.red"
omit = ["bottom", "west"]
[[object]]          # open wall shelf high on the west wall: dark back box and two ledges
kind = "box"
box = [3478, 8500, 3560, 12000]
top = -5300
bottom = -3600
material = "wood"
omit = ["west"]
group = "shelf"
[[object]]
kind = "box"
box = [3478, 8400, 3900, 12100]
top = -3700
bottom = -3600
material = "panel"
omit = ["west"]
group = "shelf"
[[object]]
kind = "box"
box = [3478, 8400, 3900, 12100]
top = -4550
bottom = -4450
material = "panel"
omit = ["west"]
group = "shelf"
[[object]]
kind = "box"
box = [3478, 8400, 3900, 8500]
top = -5300
bottom = -3600
material = "panel"
omit = ["west"]
group = "shelf"
[[object]]
kind = "box"
box = [3478, 12000, 3900, 12100]
top = -5300
bottom = -3600
material = "panel"
omit = ["west"]
group = "shelf"

[[painting]]        # plates and the clock on the east wall
wall = "east"
span = [10200, 10700]
y = [-2900, -2400]
material = "porcelain"
frame = "porcelain"
[[painting]]
wall = "east"
span = [9300, 9800]
y = [-3300, -2800]
material = "porcelain"
frame = "porcelain"
[[painting]]
wall = "east"
span = [8000, 8600]
y = [-3200, -2600]
material = "porcelain"
frame = "porcelain"
[[painting]]
wall = "east"
span = [7000, 7600]
y = [-3600, -3000]
material = "porcelain"
frame = "porcelain"
[[painting]]
wall = "east"
span = [6900, 7400]
y = [-2800, -2300]
material = "porcelain"
frame = "porcelain"
[[painting]]        # clock
wall = "east"
span = [6000, 6500]
y = [-3900, -3100]

[[hide]]            # cameras 1 and 4 stand behind the west wall: the shelf would block them
camera = 1
groups = ["shelf"]
[[hide]]
camera = 4
groups = ["shelf"]

[[light]]
at = [6500, -4000, 2900]
color = [0.95, 1.0, 1.0]
strength = 0.3
reach = 4000
[[light]]
at = [7400, -4400, 8500]
color = [0.95, 1.0, 1.0]
strength = 0.4
reach = 7000

# Lights-off (dimmer) camera set over the same geometry: the runtime scales
# the baked colours for these cameras (ratio of the originals' brightness).
[shade]
"0" = 0.58
"1" = 0.57
"2" = 0.59
