# Attic: a large dark loft of weathered horizontal planks, square posts,
# barrels and crates. The south-west corner is boxed in: the door sits on the
# east face of that box (camera 0) with a low shelf of jars against its north
# face. At the north end a stairwell drops through the floor (blocks 18/19):
# brick shaft walls with wooden treads going down north, fenced on the south
# by a low plank parapet (block 10). Zones from the RDT walls; door, shelf,
# barrels, chest and crates placed by floor picking in cameras 0-6. The
# sloping roof rafters are not modelled; the stairwell depth is a guess.
room = "ROOM2100"
title = "Attic"
seed = 2160

[shell]
floor = 0
ceiling = -6000
auto_ceiling = false   # camera 4 looks down from above the roof line; its ceiling is hidden instead
