# Terrace passage: a narrow corridor, cream plaster over a black dado, dark
# boards with a long blue-grey runner. The south end wall holds a small
# cabinet with a blue vase under an arched mirror; a door on the west wall at
# the south end (camera 0) and another on the east wall at the north end
# (cameras 1 and 2). Doors and cabinet placed by projecting the RDT walls into
# the three views. The west wall is set ~200 west of the collision line so
# camera 1, which hugs it, does not clip it at the near plane.
room = "ROOM2110"
title = "Terrace passage"
seed = 2170

[shell]
floor = 0
ceiling = -4400
floor_material = "planks"
wall_material = "plaster"
ceiling_material = "plaster.dark"
dado = 1200
dado_material = "panel.black"
chair_rail = true
skirting = 100
cell = 600

[materials]
plaster = [0.70, 0.68, 0.62]
"plaster.dark" = [0.20, 0.18, 0.16]
planks = [0.22, 0.13, 0.08]
runner = [0.42, 0.42, 0.50]
border = [0.28, 0.27, 0.34]
"panel.black" = [0.12, 0.10, 0.09]
wood = [0.30, 0.18, 0.10]
door = [0.28, 0.16, 0.10]
porcelain = [0.12, 0.30, 0.58]

[lighting]
ambient = [0.12, 0.12, 0.11]

[[zone]]
box = [1800, 1906, 3852, 13410]

[[door]]            # west wall at the south end (camera 0, right)
wall = "west"
span = [2050, 3350]
top = -3300
material = "door"
[[door]]            # east wall at the north end (cameras 1 and 2)
wall = "east"
span = [11600, 12900]
top = -3300
material = "door"

[[object]]          # runner down the corridor
kind = "rug"
box = [2150, 2000, 3500, 13300]
material = "runner"
border = 120
[[object]]          # small cabinet against the south end wall
kind = "box"
box = [2300, 1906, 3500, 2400]
top = -1300
material = "wood"
omit = ["bottom", "south"]
[[object]]          # blue vase on it
kind = "cylinder"
at = [2750, 2150]
radius = 140
top = -1900
bottom = -1300
material = "porcelain"
segments = 10

[[painting]]        # arched mirror over the cabinet
wall = "south"
span = [2350, 3450]
y = [-3500, -1700]
material = "mirror"
frame = "wood"

[[sconce]]
wall = "west"
at = [-3300, 4500]
candles = 1
strength = 0.42
reach = 3400
[[sconce]]
wall = "east"
at = [-3300, 8500]
candles = 1
strength = 0.42
reach = 3400
[[sconce]]
wall = "west"
at = [-3300, 12000]
candles = 1
strength = 0.42
reach = 3400
