# Courtyard garden behind the mansion: stone paving between brick garden
# walls (trees beyond) and hedge beds. The white back of the mansion (block
# 14) fills the south-west: the east walk runs south past its east face (the
# back door), the west walk runs west along its north face to the generator
# yard between trees at the far west end; the open garden north of the house
# corner has beds either side of the paving and the arched iron gate in a
# recess of the north wall. Open to the night sky. Approximate: the house is
# a plain white block with a timber band (no roof or balcony); the levels
# round the generator yard (block 9 may be steps) are taken as flat.
room = "ROOM3000"
title = "Courtyard garden"
seed = 3000

[shell]
floor = 0
ceiling = -14000
floor_material = "rock.cobble"
wall_material = "forest"
dado = 3000
dado_material = "brick.stone"
ceiling_material = "sky"
skirting = 0
trim = "stone"
cell = 1200

[materials]
"rock.cobble" = { color = [0.26, 0.28, 0.27], tile = [1600, 1600] }
"brick.stone" = { color = [0.40, 0.40, 0.34], rows = 6, per_row = 3, ivy = 0.35, stains = 0.4, tile = [2400, 1500] }
"plaster.house" = [0.62, 0.64, 0.62]
stone = [0.667, 0.696, 0.638]
wood = [0.26, 0.14, 0.10]
door = [0.34, 0.20, 0.12]
double_door = [0.30, 0.18, 0.10]
panel = [0.22, 0.14, 0.09]
"rust.generator" = [0.50, 0.20, 0.10]
leaves = { color = [0.20, 0.30, 0.16] }
"rock.dark" = { color = [0.17, 0.18, 0.17], tile = [2200, 2200] }

[lighting]
ambient = [0.14, 0.17, 0.16]

[[zone]]            # east walk south of the garden, past the house's east face
box = [26478, 2232, 30474, 9396]
[[zone]]            # west walk along the house's north face
box = [5004, 9396, 20844, 13212]
[[zone]]            # the open garden north of the house corner (beds on blocks 1, 3, 4)
box = [20844, 9396, 30474, 28188]
[[zone]]            # north walk's west end (block 7 beyond)
box = [18180, 21276, 20844, 28188]
[[zone]]            # recess in the north wall for the gate
box = [20700, 28188, 24900, 29500]
[[zone]]            # generator yard at the west end, between trees (camera 2 hangs over x -306)
box = [-1500, 6624, 5004, 15750]
floor_material = "hedge"

# The house: a white block standing just proud of the walk walls so the
# brick dado does not show on it
[[object]]
kind = "box"
box = [5004, 2232, 26498, 9416]
top = -5600
material = "plaster.house"
omit = ["bottom"]
[[object]]          # timber band under the eaves, east face
kind = "box"
box = [26498, 2232, 26560, 9478]
top = -5600
bottom = -4900
material = "panel"
[[object]]          # timber band under the eaves, north face
kind = "box"
box = [5004, 9416, 26498, 9478]
top = -5600
bottom = -4900
material = "panel"

[[door]]            # mansion back door in the house's east face
wall = "west"
span = [3200, 7300]
line = 26498
top = -3800
material = "double_door"
frame = "stone"
frame_depth = 200
[[door]]            # arched iron gate to the water gate path, in its recess
wall = "north"
span = [21400, 24200]
line = 29500
top = -4200
material = "door"
frame = "stone"
frame_depth = 300
[[column]]          # white gate pillars
at = [20980, 29220]
top = -4700
radius = 280
square = true
material = "stone"
[[column]]
at = [24620, 29220]
top = -4700
radius = 280
square = true
material = "stone"

# Hedge beds (flags-512 blocks) as low planters
[[object]]          # block 1, east of the garden paving
kind = "box"
box = [28044, 12546, 30474, 21546]
top = -900
material = "leaves"
omit = ["bottom"]
[[object]]          # block 4's east end, west of the garden paving
kind = "box"
box = [20844, 13212, 23310, 21546]
top = -900
material = "leaves"
omit = ["bottom"]
[[object]]          # block 3, in front of the gate
kind = "box"
box = [20844, 23724, 28602, 26478]
top = -900
material = "leaves"
omit = ["bottom"]
[[object]]          # along the foot of the west walk's north wall
kind = "box"
box = [5004, 12300, 20844, 13212]
top = -800
material = "leaves"
omit = ["bottom"]

# Generator yard: the red generator on the paving, trees either side on grass
[[object]]
