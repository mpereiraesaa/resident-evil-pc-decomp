at = [2900, 10000]
radius = 800
top = -1500
bottom = 0
material = "rust.generator"
segments = 14
hoops = [-300, -700, -1100]
[[object]]          # dark stone wall closing the yard's east side behind the generator,
kind = "box"        # brick at its foot (camera 2); camera 1 sees it as the walk's dark far end
box = [5004, 9396, 5400, 13212]
top = -7000
bottom = -1800
material = "rock.dark"
[[object]]
