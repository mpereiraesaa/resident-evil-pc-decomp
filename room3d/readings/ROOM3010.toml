# Water gate: a dark garden of stone paths and low walls over pools of
# water, under the night sky. The south entry path (x 21000-24300) runs
# between tree masses from the arched gate up to the low cross wall at
# z 10710-11736; north of it the west pool (block 8) with the black iron
# sluice frame and its dial pillar (camera 3) and the east channel. A lawn
# west of the pool, a stone wall along the west path. Approximate: the pool
# basins are flat water slabs at floor level (the originals show them sunk,
# with a ladder down from the cross wall), the arched balustrades are not
# modelled, and the west door is kept from an earlier reading unconfirmed.
room = "ROOM3010"
title = "Water gate"
seed = 3010

[shell]
floor = 0
ceiling = -14000
floor_material = "rock.flag"
wall_material = "forest"
dado = 900
dado_material = "brick.stone"
ceiling_material = "sky"
skirting = 0
trim = "stone"
cell = 1200

[materials]
"rock.flag" = { color = [0.30, 0.32, 0.28], tile = [2000, 2000] }
"brick.stone" = { color = [0.36, 0.38, 0.32], rows = 6, per_row = 3, ivy = 0.4, stains = 0.4, tile = [2400, 1500] }
stone = [0.638, 0.667, 0.609]
wood = [0.26, 0.14, 0.10]
door = [0.34, 0.20, 0.12]
water = [0.17, 0.33, 0.33]   # dark teal; anything darker reads as a black hole
leaves = { color = [0.30, 0.44, 0.28] }
"iron.dark" = [0.05, 0.05, 0.05]
"steel.sign" = [0.62, 0.60, 0.56]

[lighting]
