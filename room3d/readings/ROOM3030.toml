# Heliport: an asphalt pad with the orange circled H, pale concrete panel
# walls with a railing on top and the forest beyond. The steel lift block
# stands in the south-west corner with its WARNING gate facing east; two grey
# bins against the south wall; an ivy-covered building with floodlights in the
# north-west and a low base with gas tanks west. Blocks identified by
# projecting the collision into the eight views.
room = "ROOM3030"
title = "Heliport"
seed = 3030

[shell]
floor = 0
ceiling = -14000
floor_material = "concrete.asphalt"
wall_material = "forest"
dado = 4400
dado_material = "stone.panel"
ceiling_material = "sky"
skirting = 0
trim = "concrete"
cell = 1500

[materials]
"concrete.asphalt" = { color = [0.30, 0.31, 0.32], stains = 0.8 }
"stone.panel" = { color = [0.841, 0.87, 0.87], tile = [3000, 3000] }
stone = [0.754, 0.783, 0.783]
wood = [0.60, 0.62, 0.62]
door = [0.64, 0.66, 0.66]
"double_door.lift" = [0.70, 0.72, 0.74]
"night.sky" = [0.06, 0.10, 0.10]
steel = [0.40, 0.42, 0.44]
"grating.lift" = [0.70, 0.72, 0.72]
plastic = [0.66, 0.68, 0.68]
velvet = [0.70, 0.10, 0.08]
"plaster.ivy" = { color = [0.42, 0.44, 0.42], stains = 0.4, ivy = 0.7 }

[lighting]
ambient = [0.20, 0.21, 0.22]

[[zone]]
box = [2722, 2826, 29574, 30834]

[[object]]          # the helipad marking (centre and size cast from cameras 1, 2 and 5)
kind = "rug"
box = [16650, 13650, 23350, 20350]
