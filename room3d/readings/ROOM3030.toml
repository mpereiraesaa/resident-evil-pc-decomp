[[object]]          # lift block in the south-west corner (collision block 8)
kind = "box"
box = [2722, 2826, 7974, 8424]
top = -5000
material = "steel"
omit = ["bottom", "south", "west"]
[[door]]            # lift gate with the WARNING plate on the block's east face (the pad's west side)
