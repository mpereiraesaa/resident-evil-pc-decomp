# Fountain court at night: dark stone paving between tall hedges and the
# forest, a white shed wall with a double door on the west side of the west
# court, a stone balustrade with square posts along the south and east edges
# and around the hedge bed in the north-east. The fountain is a raised stone
# ring on a two-step round platform (platform from collision circle 0, ring
# from blocks 4-6); its rim is a ring of overlapping stone drums around the
# water. Camera 5 is the cutscene of the drained fountain revealing the
# spiral stair and lift: kept as the original background (the builder has no
# spiral stair). The west strip floor is the rust-red lift deck seen from
# camera 0; the machinery beside the shed is a dark box. Tree trunks in the
# planters are not modelled.
room = "ROOM3050"
title = "Fountain"
seed = 3050
backdrop = [5]

[shell]
floor = 0
ceiling = -14000
floor_material = "rock.flag"
wall_material = "forest"
dado = 0
ceiling_material = "sky"
skirting = 0
trim = "stone"
cell = 1500

[materials]
"rock.flag" = { color = [0.25, 0.25, 0.26], tile = [2000, 2000], moss = 0.0 }
"plaster.shed" = { color = [0.70, 0.72, 0.78], stains = 0.2 }
"concrete.lift" = { color = [0.34, 0.13, 0.09], stains = 0.5 }
forest = { color = [0.14, 0.22, 0.12] }
leaves = { color = [0.12, 0.22, 0.10] }
stone = [0.22, 0.23, 0.25]
wood = [0.26, 0.14, 0.10]
door = [0.34, 0.20, 0.12]
water = [0.16, 0.22, 0.22]

[lighting]
ambient = [0.20, 0.21, 0.23]

[[zone]]            # east court around the fountain
box = [10440, 2070, 30420, 23220]
[[zone]]            # west court
box = [2412, 14598, 10440, 23220]
[[zone]]            # west strip north of the beds (the lift deck)
box = [2592, 12132, 10440, 14598]
floor_along = "x"
floor_material = "concrete.lift"
[[zone]]            # drop beyond the south balustrade, trees further off
box = [10440, -2500, 32000, 2070]
