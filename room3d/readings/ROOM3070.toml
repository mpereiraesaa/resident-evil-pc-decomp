# Underground entry: a rough cave U around a rock mass, yellow-green rock,
# lanterns. A red iron door closes the south end of the west leg; the east
# leg runs on past its collision line to an end wall with a rusty ladder, and
# a second iron door sits in a recess to its east (both cast from camera 0).
# A pale dressed-stone pillar stands in the east leg near its north end;
# a wooden desk with a typewriter sits in a niche at the north-west corner
# of the rock mass (cast from camera 3; collision circle 6 is the desk, not
# a pillar).
