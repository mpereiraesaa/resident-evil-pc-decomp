# floor, no machine stands there), and the east room. The east room runs on
# past its collision line to x 27126: at its back a grey cabinet and a long
# wooden workbench with the open-frame generator (drums, struts) behind,
# all cast from camera 7. Doors west (two) and south. Cables not modelled.
