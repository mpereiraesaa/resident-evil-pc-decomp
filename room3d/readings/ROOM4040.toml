# Guardhouse bar: a large games room in plank walls around a solid core. The
# bar counter with bottle shelves stands in the south-east, round tables with
# white cloths and red stools across the bar hall, a potted plant and barrels
# at its west end; the pool table in the west room, two small clothed tables
# in the middle, the pinball machine in the north niche, a dartboard, hanging
# lamps; red door on the core's east face. Placed from projected collision.
room = "ROOM4040"
title = "Guardhouse bar"
backdrop = [6]  # camera 6 is a close-up of the pinball table
seed = 4040

[shell]
floor = 0
ceiling = -4800
floor_material = "planks.floor"
wall_material = "planks.wall"
ceiling_material = "planks.ceiling"
skirting = 160
cell = 900

[materials]
"planks.floor" = { color = [0.40, 0.26, 0.14], count = 8 }
"planks.wall" = { color = [0.28, 0.18, 0.12], count = 14 }
"planks.ceiling" = { color = [0.30, 0.19, 0.11], count = 10 }
wood = [0.32, 0.20, 0.11]
"door.red" = [0.46, 0.10, 0.10]
