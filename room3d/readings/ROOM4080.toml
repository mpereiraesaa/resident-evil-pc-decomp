# Beehive passage: plank corridors overgrown with vines; an L of the main
# corridor west-east along the south, a leg north on the east, the small
# west pocket, with the keypad, the wasp nest and several doors. The north end
# of the east leg is taller, with an alcove holding a pedestal table; the nest
# is an egg-shaped globe placed by triangulating cameras 3/4.
room = "ROOM4080"
title = "Beehive passage"
seed = 4080
backdrop = [5]  # camera 5 is a close-up of the wall keypad

[shell]
floor = 0
ceiling = -4400
floor_material = "planks.floor"
wall_material = "planks.vine"
ceiling_material = "planks.ceiling"
chair_rail = true
dado = 1300
dado_material = "planks.dado"
skirting = 160
cell = 800

[materials]
"planks.floor" = { color = [0.36, 0.24, 0.13], count = 8 }
"planks.vine" = { color = [0.22, 0.20, 0.12], count = 14 }
"planks.dado" = { color = [0.22, 0.14, 0.10], count = 14 }
"planks.ceiling" = { color = [0.22, 0.14, 0.09], count = 10 }
wood = [0.40, 0.26, 0.13]
door = [0.36, 0.24, 0.12]
"door.red" = [0.42, 0.10, 0.10]
"planks.red" = { color = [0.20, 0.09, 0.06], count = 14 }
"plaster.nest" = { color = [0.62, 0.60, 0.46], stains = 0.5 }

[lighting]
ambient = [0.20, 0.19, 0.13]

[[zone]]            # south corridor
box = [2538, 2016, 28386, 6030]
floor_along = "x"
[[zone]]            # strip north of the corridor, west part
box = [2538, 6030, 14688, 8946]
[[zone]]            # middle hall (camera 6 stands here)
box = [7974, 8946, 14688, 14022]
[[zone]]            # east leg north
box = [14688, 6030, 18594, 17000]
[[zone]]            # north end of the east leg: taller (camera 3 sees its end wall
                    # and the alcove opening reach ~-5800), the wasp nest hangs here
box = [14688, 17000, 18594, 22536]
ceiling = -5800
wall_materials = { east = "planks.red", north = "planks.red" }
[[zone]]            # alcove at the north end (gap between collision 0 and 1) with
                    # the lamp-lit pedestal table
box = [14688, 22536, 16668, 23814]
ceiling = -5800

[[door]]
wall = "west"
span = [2200, 4300]
