# panels, a stone fireplace on the north wall (block 2) with a dark chimney
# breast up to the ceiling, a big Persian rug on dark planks, Plant 42's
# roots spread across the ceiling, a double door and a single door on the
# west wall. Camera 7 is the vine-grown 003 corridor east of the hall: a
# room of its own reached past the east wall, door 003 on its north side
# (its vine-covered vertical boards are drawn as dark horizontal planks)
# and a dark passage beyond. Root shapes and the vine growth are approximate.
