# Laboratory entry: a tall concrete hall (ceiling ~6000) where the lift
# arrives. The lift bay is the south-east corner (grated floor plate, rust
# cage side on its west); the big rusty XD-R B.1 tank stands against the
# south wall with a grey cabinet and a hand truck west of it. The east wall
# and the lift bay walls carry rust posts with X-braced steel, a pipe runs
# along the top of the east wall; the west wall has the grey double door
# between two orange mesh panels (emergency exit sign on the north one) under
# a red rail. Camera 4 is a close-up of the exit sign and keeps the original
# background. The tank lettering and the hand truck's shape are approximate.
room = "ROOM5000"
title = "Laboratory entry"
seed = 5000
backdrop = [4]

[shell]
floor = 0
ceiling = -6000
floor_material = "concrete.floor"
wall_material = "concrete"
ceiling_material = "concrete.ceiling"
