# Emergency tunnel: a winding corridor of dark blue-grey stained concrete
# panels with dark pilasters between them and fluorescent strips overhead.
# From the double door at the east end it runs west, turns north up a riser,
# west along a cross passage, north again under a big pipe, and ends at the
# XD-R B1 lift gate (west wall) with the phone beside it (north wall). Zones
# are the gaps between the collision blocks; pilaster spacing is approximate.
room = "ROOM5010"
title = "Emergency tunnel"
seed = 5010
backdrop = [7]  # camera 7 is a close-up of the phone

[shell]
floor = 0
ceiling = -4000
floor_material = "concrete.floor"
wall_material = "concrete"
ceiling_material = "concrete.ceiling"
skirting = 140
trim = "iron"
cell = 800

[materials]
concrete = { color = [0.30, 0.35, 0.40], stains = 0.7, panels = 1, tile = [3200, 4000] }
"concrete.floor" = { color = [0.50, 0.51, 0.52], stains = 0.8, panels = 1 }
"concrete.ceiling" = { color = [0.26, 0.26, 0.25], stains = 0.3 }
"double_door.lab" = [0.24, 0.20, 0.18]
iron = [0.10, 0.12, 0.14]
steel = [0.30, 0.32, 0.34]
"grating.gate" = { color = [0.62, 0.62, 0.60], tile = [600, 600] }

[lighting]
ambient = [0.13, 0.14, 0.16]

[[zone]]            # south passage (east end: the double door)
box = [13518, 2214, 30618, 4842]
floor_along = "x"
[[zone]]            # riser north
box = [13518, 4842, 16272, 16722]
[[zone]]            # cross passage west
