# Lab ladder room: a tall grey concrete cell with a dark stain band, two
# deep beams across the ceiling with the hatch between them, a rusty ladder
# up the north wall to the hatch, a pipe and a wall vent on the east wall,
# fluorescent tubes on the side walls, and the metal door with its red lamp
# in the south wall. Collision block 3 by the west wall is the red item chest
# in cameras 0/1 but a wooden crate in cameras 2/3 (the original backgrounds
# disagree), so each camera pair hides the other one.
