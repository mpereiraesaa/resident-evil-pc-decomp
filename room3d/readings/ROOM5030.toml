# Lab B2 stairway: dark stained concrete. A landing runs east-west along
# the south wall with three grating panels let into its floor and a metal
# door at its east end (north wall). North of the landing a railed steel
# stair drops north into the well; west of the rail a walkway leads north
# past the XD-R B.2 stencil to a corridor running west, with the double door
# to the visual data room in its south wall and a desk with a phone closing
# its west end. Pipes along the south wall under the ceiling. Door spans and
# grating panels are cast from the views and approximate.
room = "ROOM5030"
title = "Lab B2 stairway"
seed = 5030
backdrop = [4]  # camera 4 is a close-up of the VISUAL DATA ROOM plate

[shell]
floor = 0
ceiling = -4800
floor_material = "concrete.floor"
wall_material = "concrete"
ceiling_material = "concrete.ceiling"
