# Visual data room: blue-grey concrete, strip lights under ceiling beams, a
# long table with six chairs and a projector at its south end, the pull-down
# screen on the south wall, the double door on the north wall, a whiteboard on
# a stand in the south-west, a bookcase in a west-wall niche and another in
# the north-east corner, a phone table on the west wall, and a deep pilaster
# stepping the east wall (blocks 10/13). Positions from collision blocks and
# floor picks; the whiteboard is angled in the original (here square to the
# room) and the ceiling beams/strip lights are a simplified lattice.
room = "ROOM5040"
backdrop = [4]       # close-up of the screen: a magnified insert, larger than the screen seen in cam1
title = "Visual data room"
seed = 5040

[shell]
floor = 0
ceiling = -5000
floor_material = "concrete.floor"
wall_material = "concrete"
ceiling_material = "concrete.ceiling"
skirting = 0
trim = "steel"
cell = 800

[materials]
concrete = { color = [0.44, 0.52, 0.56], stains = 0.5 }
"concrete.floor" = { color = [0.30, 0.38, 0.40], stains = 0.4 }
"concrete.ceiling" = { color = [0.26, 0.30, 0.32], stains = 0.3 }
"door.lab" = [0.50, 0.46, 0.40]
"double_door.lab" = [0.52, 0.50, 0.46]
steel = [0.60, 0.62, 0.64]
wood = [0.30, 0.17, 0.10]
velvet = [0.16, 0.24, 0.46]
plastic = [0.56, 0.58, 0.58]
"iron.beam" = [0.16, 0.18, 0.20]
paper = [0.90, 0.92, 0.94]
"books.lab" = { color = [0.30, 0.30, 0.34], shelves = 4 }

[lighting]
ambient = [0.14, 0.16, 0.18]

# Visible walls sit 500-900 units behind the collision blocks (floor picks
# along the skirtings): west x 1400, south z 1550, east x 12800, north z 15400.
[[zone]]            # south half
box = [1400, 1550, 12800, 7800]
[[zone]]            # beside the pilaster (blocks 10/13 end)
box = [1400, 7800, 11900, 9200]
[[zone]]            # north half
box = [1400, 9200, 12900, 15400]

