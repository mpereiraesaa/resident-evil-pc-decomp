# Lab B3 passage: blue-grey concrete corridors in a loop round a solid core.
# The south corridor has a dark braced duct hung under its ceiling, a jutting
# block whose south face carries the EXIT double door, and a double door in
# the east wall at its end. The east leg (hazard stripes along its walls, a
# pipe cluster overhead) ends at a double door north; the north passage runs
# west to a double door in the west wall, beside the foot of the stair that
# climbs north in the north-west. Doors cast from the views; ducts and pipes
# are plain boxes.
