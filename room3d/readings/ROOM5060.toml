# Small laboratory: green-grey walls over a grey tile floor. The white cryo
# tube lies east-west in the middle on dark end stands (collision block 3).
# West wall: a lit bottle fridge, a tall dark cabinet with a hazard plate,
# and a dark counter with jars and boxes under a round white hood; the steel
# drum stands in front of it. North wall: a white counter with a green-lit
# glass display, a dark bench with a machine, a beige instrument box and the
# black computer desk in the north-east corner with a blue chair. East wall:
# a trolley of bottles beside a jut whose west face holds the double door
# with the EXIT sign. South wall:
# a long counter with a gas cylinder, and a thick wall jut further east.
# The ceiling is high (cam0 shows wall far above the door). The visible walls stand a little outside the collision lines (floor picks
# land ~500-800 beyond them), so the shell is widened accordingly.
room = "ROOM5060"
title = "Small laboratory"
seed = 5060
backdrop = [4, 5]  # cameras 4/5 are close-ups of the computer screen

[shell]
floor = 0
ceiling = -6500
floor_material = "tiles.floor"
wall_material = "concrete"
ceiling_material = "concrete.ceiling"
skirting = 120
trim = "concrete.trim"
cell = 800

[materials]
