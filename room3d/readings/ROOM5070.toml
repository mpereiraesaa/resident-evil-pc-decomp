# Morgue: two separate cells in one file. West, the bunk room: stained
# concrete with a green-black damp band, deep beams and vents overhead, a
# row of five cots with dark mattresses and body bags along the north wall,
# a metal desk with a chair in the south-west, open steel shelving on the
# east wall, and the double door with its red lamp in the south alcove.
# East, the operating room: white tiled walls over a dark stained floor, the
# operating table with its lamp, two green machines on trolleys, a sink on
# the south wall beside the double door with the green EXIT light, and a
# cabinet in the north-west corner. Cot spacing cast from camera 1; door
# spans cast from cameras 2 and 4.
