# Lab B3 private passage: a long dark concrete corridor running east-west,
# a double door at each end (the west one X-braced, with the keypad and
# battery panel beside it on the north wall), a side door on the north wall
# about mid-way and another on the south wall near the east end, a red alarm
# box and fire extinguisher on the north wall near the east end, a green
# exit sign low on the south wall near the west end, pipes along the south
# side of the ceiling and round ceiling lamps. The visible walls stand
# 400-700 units behind the collision blocks (floor picks along the
# skirtings). Cam 4 is the keypad close-up and keeps its background.
room = "ROOM5080"
title = "Lab B3 private passage"
seed = 5080
backdrop = [4]

[shell]
floor = 0
ceiling = -4600
floor_material = "concrete.floor"
