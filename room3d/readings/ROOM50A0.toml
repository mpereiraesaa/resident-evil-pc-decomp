# Lab B3 room B: a bare cell of stained beige concrete under a ceiling beam
# and a run of pipes. North wall: a wall basin with a mirror, a light bar
# and a bottle shelf, a small crate beside it, and the door further east
# with an electrical box over it. East wall: a black desk with a green
# office chair under a wooden board. West wall: the large framed Adam-and-Eve
# picture (the puzzle). Cameras 0-3 are the same views as 4-7 with the
# lights out; cameras 3 and 7 are close-ups of the picture and keep the
# original background.
