# Cell entry: a dark concrete L. The west leg runs north-south with an
# X-braced iron double gate at the south end of its east wall and an amber
# beacon high on its west wall; at its north end the passage turns east, the
# heavy cell door (barred window, keypad, sign plate) on its south wall near
# the east end, a red alarm box and extinguisher on its north wall, a camera
# on the end wall. Pipes along the ceiling, round ceiling lamps and small
# floor-level wall lamps. Visible walls (floor picks along the skirtings) sit
# a few hundred units off the collision blocks. Cam 3 is the cell-door
# close-up (cam 2 picks put the door ~1000 further east than cam 3's; the
# span leans to cam 3): the door is a flat steel door, the barred window and keypad are
# approximated with bands.
