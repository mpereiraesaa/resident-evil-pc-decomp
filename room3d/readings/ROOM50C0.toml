# Lab B3 elevator entry / power house: dark teal concrete corridors. A main
# corridor runs north-south (the X-braced power-house double door under a
# hazard-striped lintel at its south end, a red lightning emblem painted on
# the floor before it, a door on its east wall, a black pipe dropping from the
# ceiling onto its west wall, a low green exit lamp); a branch runs west to a
# double door, with a door on its north wall and a red alarm button on its
# south wall; at the north end the corridor opens east to the mesh lift gate
# (XD-R B.3) with the big B.3 stencil on the north wall. Green floor lines.
# Visible walls from floor picks along the skirtings sit 300-600 units off the
# collision blocks (the lift gate ~800 behind block 1). Floor lettering and
# the B.3 stencil are not modelled. Cams 3/7 and 2/6 are the same views
# (lift lit / unlit).
