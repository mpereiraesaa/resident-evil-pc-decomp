# Lab save room: small bare concrete room with heavy cross beams and tube
# lights mounted high on the side walls. A dark metal desk with the
# typewriter and a desk lamp in the north-west corner (cork board above it,
# green chair in front), an iron-framed bed along the north wall, an open
# white steel shelf unit with binders against the east wall, the red item
# chest in the south-east, the door at the south end of the west wall.
# Visible walls from floor picks sit 300-500 units inside the collision
# blocks' outer edges (north wall ~10900, so cam 0 looks in from behind it).
# Heights measured in the views are large for this room: door 4400, bed 900,
# shelf 4000, beams' underside ~5700.
