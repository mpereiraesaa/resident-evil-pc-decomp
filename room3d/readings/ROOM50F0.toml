# Power maze 1: walkways threaded between big orange-brown generator
# blocks, all under amber light. The outer walls are dark steel cages (a fine
# diamond mesh over darkness). Machinery blocks 2, 3 and 5 are zones of their
# own (no cage wall in front of them) carrying their machines: block 5 a dark
# lower housing with beige upper housings, a red tank lying along its top
# and yellow drop pipes; block 2 a riveted drum with red/white risers at its
# north-west corner, a red-topped tank at the north end, a tall middle
# housing, a beige control box and white risers on the east face; block 3 a
# housing ringed with cooling fins, a yellow rail round its top and a gauge
# disc. Yellow railings along the walkways, hazard stripes and grating
# panels on the floor. A computer console hangs on the west wall of the
# south-west bay; a door in the north wall of the north corridor and one at
# the south end of the east corridor (on block 7). Machine positions and
# heights are read off the camera views; WARNING plates, cabling and gauges
# beyond the one disc are left out.
