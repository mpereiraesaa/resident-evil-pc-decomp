# Power maze 1: walkways threaded between big orange-brown generator
# blocks, all under amber light. The outer walls are dark steel cages (a fine
# diamond mesh over darkness); the machinery blocks (collision blocks 2, 3,
# 5, 7) stand as riveted dark orange-brown housings about 2.6 m tall with
# the cage rising above them, yellow railings along the walkways, hazard
# stripes on the floor edges and grating panels at the corners. A computer
# console hangs on the west wall of the south-west bay; a door in the north
# wall of the north corridor and one at the south end of the east corridor
# (on block 7). Pipes, gauges and signs on the machines are left out.
