# Power maze 2: the same amber-lit walkways between machinery under dark
# steel cages (fine diamond mesh). The south corridor runs east-west along
# the south wall past the louvred machine housing of collision block 5; the
# west leg turns north past the big yellow gas tank at the south end of
# block 4; the
# north corridor runs back east to the east leg, which climbs north to the
# door at its end. A small bay at the east end of the south corridor holds a
# desk with a clipboard and barrels (blocks 6/7). Yellow railings and hazard
# stripes line the walkways; white-and-orange vertical pipes stand at the
# corners. Machine detail (louvres, WARNING plates, gauges) is left out.
