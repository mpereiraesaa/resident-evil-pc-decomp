# south wall near the south-west corner with the wall basin and mirror on the
# west wall beside it (blocks 5/6), two pipes run high along the south wall,
# the barred steel door is in the north wall with a call box beside it and a
# security camera high in the north-west corner. Walls from floor picks; the
# east wall is pushed out to x 9300 so cam 2 (x 9090) stands inside.
