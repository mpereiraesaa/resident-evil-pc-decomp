# Main lab: one tall hall of blue-grey concrete panels over a shiny grey
# tile floor. The middle (collision block 2) is the tank bed: two rows of
# green glowing glass tanks on black bases, each capped by dark machinery
# hanging from the ceiling, a railing round the bed and a trench of pipes
# between the rows. Banks of computer cabinets line the west and east walls
# and the west end of the south wall; in the south (block 10) the big
# white-glowing capsule stands on its black base beside a computer terminal.
# The double door is in the north wall of the west bay. Tank positions come
# from the original mask groups; cables on the floor and ceiling ducts are
# left out. Camera 6 is a close-up of the capsule and keeps the original.
room = "ROOM5130"
title = "Main lab"
seed = 5190
backdrop = [6]

[[hide]]            # camera 5 hangs right over the capsule top
camera = 5
groups = ["capsule"]

