# Main lab entry (B.4): dark grey panelled concrete in an L. The main
# corridor runs east-west and ends east at the mesh lift gate (XD-R B.4)
# with a light box above it and a call button beside it; three grating
# patches in the floor before the lift. The short south leg runs from the
# west end of the corridor down to the red-lit double door on its south wall
# (biohazard mat in front); an electrical panel over a low cabinet on the
# leg's east wall, a low vented unit on the corridor wall east of the corner. Louvred vents high on the walls, a pipe
# run along the top of the north wall, strip lights. Walls follow the
# collision blocks (they line up with the skirtings in the block overlay);
# the B.4 stencil is not modelled.
