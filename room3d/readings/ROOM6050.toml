# Return-visit copy of ROOM1050.toml: stage 6 shares its collision and cameras exactly.
# Mansion dining room. Shell from ROOM1050.RDT blocks 0,3,4,7; table from
# block 8; chairs from circles 9,11,13,14,19-22; columns from circles 1,6,10,18;
# fireplace from block 16; urn from circle 15. Gallery and heights from the
# views (cameras 0-2 show the upper balustrade and the east arches).
