# Return-visit copy of ROOM1060.toml: stage 6 shares its collision and cameras exactly.
# Mansion main hall. Shell from ROOM1060.RDT blocks 0,1,11,20; colonnades
# from the type-3 circles; north gallery depth, void edge and stair top from
# ROOM2030 (2F hall) collision; lamp posts and chest-of-stair details from
# floor-cast mask sprites. See docs/ROOM3D_FOUNDATION.md.
