# Return-visit copy of ROOM10E0.toml: stage 6 shares its collision and cameras exactly.
# Mansion 1F keeper's bedroom: striped wallpaper over a dark panelled dado,
# plank floor, dark plank ceiling. Long north-south room: the bed stands
# against the west wall in the middle, a bookshelf further north on the west
# wall, a dresser on the north wall, the door on the east wall. At the south
# end the west wall opens into a walk-in closet (clothes on a rail, a shelf of
# boxes over it), the desk with its lamp stands against the east wall
# (block 7), and a patterned rug lies between them.
# The west wall of the north part is block 4's face (x 3042); block 5 is the
# furniture strip in front of it. From ROOM10E0.RDT blocks 0-12 (blocks 9-12
# are the closet's solid floor),
# camera masks and floor picks. The closet's broom, bucket and the desk chair
# are left out.
room = "ROOM60E0"
title = "Keeper's bedroom (return)"
seed = 1400

[shell]
floor = 0
ceiling = -4800
floor_material = "planks"
wall_material = "wallpaper"
ceiling_material = "planks.ceiling"
dado = 1100
dado_material = "panel"
