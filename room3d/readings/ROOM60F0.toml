# Return-visit copy of ROOM10F0.toml: stage 6 shares its collision and cameras exactly.
# Mansion bar: tan plaster over a dark red dado, red planks, the bar counter
# along the west wall with its curved end, stools, a round table, the grand
# piano and two plants, red door in the south-east pocket, a tall dish hutch in
# the north-east bay; a passage (stone west and end walls, ivy-grown glass on
# the east) leads north to the bust alcove, which has no door (the wall slides).
# The passage walls carry the shell dado, covered with stone/ivy bands.
room = "ROOM60F0"
title = "Mansion bar (return)"
seed = 1500

[shell]
floor = 0
ceiling = -5000
floor_material = "planks"
wall_material = "plaster"
ceiling_material = "plaster.dark"
dado = 1500
dado_material = "panel.red"
chair_rail = true
skirting = 180
cell = 800

[materials]
plaster = [0.56, 0.48, 0.34]
"plaster.dark" = [0.20, 0.18, 0.14]
"panel.red" = [0.36, 0.12, 0.10]
planks = [0.44, 0.18, 0.11]
wood = [0.30, 0.17, 0.10]
"door.red" = [0.60, 0.12, 0.10]
door = [0.28, 0.17, 0.10]
stone = [0.46, 0.46, 0.42]
"books.bottles" = { color = [0.22, 0.10, 0.07], shelves = 4 }
"stone.floor" = { color = [0.40, 0.40, 0.36], tile = [1600, 1600] }
leaves = [0.22, 0.30, 0.20]
"stone.pale" = [0.50, 0.48, 0.42]
"plaster.shade" = [0.10, 0.09, 0.07]
"books.dishes" = { color = [0.42, 0.44, 0.52], shelves = 3 }

[lighting]
