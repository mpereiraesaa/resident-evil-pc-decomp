# Mansion stair passage (return visit): grey-green plaster streaked with dark
# damp, dark wood trim, worn planks. A low west corridor ends at a door; a
# narrow wooden stair climbs east along the corridor to an upper landing about
# a storey higher (camera heights put that floor near -6600), where a carved
# grandfather clock stands behind a wrought balustrade; the upper floor turns
# south down an east leg and west to a panelled door. Upper floors are slabs
# over open zones. From ROOM6100.RDT collision and its five backgrounds.
room = "ROOM6100"
title = "Clock stair passage"
seed = 6100

[shell]
floor = 0
ceiling = -4400
floor_material = "planks"
wall_material = "plaster"
ceiling_material = "plaster.ceiling"
skirting = 260
