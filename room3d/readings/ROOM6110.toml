top = -2350
bottom = -1500
material = "statue"
segments = 8
[[chandelier]]      # the globe itself (one globe, no arms)
at = [7281, 5461]
y = -2720
ceiling = -3300
radius = 0
globes = 1
globe_radius = 560
strength = 0.08
reach = 2500

[[object]]          # blue sofa on the south wall (block 9)
