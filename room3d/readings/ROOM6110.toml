# Return-visit copy of ROOM1110.toml: stage 6 shares its collision and cameras exactly.
# Mansion dressing room: pale blue-grey plaster with a frieze, cream tiles
# with teal medallions, coffered ceiling, the eagle-and-globe statue in the
# middle, the blue sofa on the south wall under the big landscape, the dresser
# with its arched mirror on the east wall, the tall dark display cabinet that
# splits off the north corridor (small writing table at its west end under a
# sconce) and the passage east. Placements come from the collision blocks
# (statue = circle 8, sofa = 9, dresser = 4, cabinet = 3, table = 6). The
# statue is cylinders plus a one-globe "chandelier" standing in for the globe.
# Camera 4 is a close-up of the table drawer and keeps the original.
room = "ROOM6110"
title = "Dressing room (return)"
seed = 1700
backdrop = [4]

[shell]
floor = 0
ceiling = -5600
floor_material = "carpet.tile"
wall_material = "plaster"
ceiling_material = "coffer"
chair_rail = true
dado = 1300
dado_material = "plaster.low"
skirting = 160
cell = 800

[materials]
plaster = [0.70, 0.74, 0.74]
"plaster.low" = [0.62, 0.68, 0.68]
"carpet.tile" = { color = [0.70, 0.76, 0.74], motif = [0.26, 0.52, 0.50], tile = [1800, 1800] }
coffer = [0.44, 0.30, 0.18]
wood = [0.30, 0.17, 0.09]
"wood.dark" = [0.10, 0.07, 0.05]
"books.display" = { color = [0.14, 0.11, 0.09], shelves = 5 }
velvet = [0.20, 0.27, 0.46]
statue = [0.40, 0.37, 0.33]
glow = [0.62, 0.86, 0.80]
mirror = [0.40, 0.44, 0.40]
stone = [0.50, 0.48, 0.46]
door = [0.34, 0.12, 0.08]

[lighting]
ambient = [0.17, 0.18, 0.18]

[[zone]]
box = [1864, 1899, 12505, 12249]
[[zone]]            # passage east
box = [12505, 10407, 23135, 12249]
floor_along = "x"

[[door]]
wall = "west"
span = [3650, 5560]
top = -3300
material = "door"
[[door]]
wall = "east"
span = [10407, 12249]
top = -3300
material = "door"

# Eagle-and-globe statue (collision circle 8): octagonal plinth, shaft,
