# Return-visit copy of ROOM1140.toml: stage 6 shares its collision and cameras exactly.
# Boiler terrace behind the mansion: stone paving with a parapet and iron
# railing on the open side, ivy-covered brick walls, the copper still and
# barrels at the east end, a door at the north end of the walkway.
