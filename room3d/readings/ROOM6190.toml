# Mansion 1F study (return visit): navy and white striped wallpaper with torn
# patches, red-brown planks, a cream patterned rug. A dark wardrobe in the
# south-east corner beside the door, a bookcase along the west wall, a desk
# under the north window (green-framed panes, cream curtains), small framed
# pictures, a potted plant and red upholstered chairs. Cameras 0-1 show the
# room lit and 2-3 dark; the mesh bakes the lit state.
# From ROOM6190.RDT collision and its four backgrounds.
