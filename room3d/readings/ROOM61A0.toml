# Return-visit copy of ROOM11A0.toml: stage 6 shares its collision and cameras exactly.
# Roofed garden passage: a sunken walk between ivy-hung stone walls topped by
# a dark red ledge, with raised galleries set back above both ledges (an
# arcade of dark arched openings and square piers on the east, piers on the
# west), a dark plank roof high over everything, crazy-paved green floor.
# At the north end a bay with big round ivy-covered planters (circles 2, 3,
# 4), the door in its east wall and the bronze relief on its north wall.
# A dark doorway opens in the east wall at the south end (camera 0).
# Shell from blocks 6, 8, 9 (passage) and 0, 1 (bay); the galleries' depth,
# the ledge height (-3600) and the roof height are read off cameras 1 and 2
# and are approximate; the arches are drawn square-headed (the builder only
# arches windows on north/south walls, so they are dark wall bands). Camera 4 is the relief close-up and
# keeps the original.
