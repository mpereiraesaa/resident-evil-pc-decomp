# Return-visit copy of ROOM2010.toml: stage 7 shares its collision and cameras exactly.
# 2F right stairs: the top of ROOM10B0's switchback. Olive-gold damask
# corridor with glossy red-wood trim and pilasters, a landing round the
# stairwell. The well holds the switchback: the upper flight (south half)
# drops west from the landing to a half landing, the lower flight (north
# half) drops back east to 1F. Rails sit on the centre lines of the low
# blocks 3, 4, 10 (those blocks are footprint plus walking margin). Doors:
# corridor north end, corridor west wall (picked from cam5), the south wall
# of the south-east pocket (open in cam4), landing west wall.
room = "ROOM7010"
title = "2F right stairs (return)"
seed = 2010
backdrop = [7]  # camera 7 is a close-up of the door keypad

[shell]
floor = 0
ceiling = -8000
floor_material = "planks"
wall_material = "wallpaper"
ceiling_material = "plaster.dark"
skirting = 260
chair_rail = true
cell = 700

[materials]
wallpaper = { color = [0.52, 0.48, 0.17], motif = [0.25, 0.23, 0.06], repeats = 3, tile = [1800, 1800] }
"plaster.dark" = [0.20, 0.17, 0.08]
planks = [0.30, 0.14, 0.07]
wood = [0.56, 0.17, 0.08]
door = [0.36, 0.20, 0.10]
"wood.stair" = [0.16, 0.08, 0.04]

[lighting]
ambient = [0.12, 0.11, 0.05]

[[zone]]            # long corridor
box = [14454, 2232, 16596, 26262]
[[zone]]            # south-east pocket
box = [16596, 2232, 21312, 4590]
floor_along = "x"
[[zone]]            # landing west strip
box = [2340, 7328, 6350, 15156]
[[zone]]            # landing south strip
box = [6350, 7328, 14454, 9480]
floor_along = "x"
[[zone]]            # landing north strip
box = [6350, 12740, 14454, 15156]
floor_along = "x"
[[zone]]            # landing east strip, where the upper flight arrives
box = [14100, 9480, 14454, 12740]
[[zone]]            # the well itself, down to 1F
box = [6350, 9480, 14100, 12740]
open_floor = true
depth = 6000
shaft_material = "plaster.dark"

[[door]]            # pocket door, south wall (cam4)
wall = "south"
span = [17700, 19800]
top = -3300
