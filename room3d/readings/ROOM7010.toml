[[stair]]           # lower flight, north half: from the half landing back east down
x = [8400, 14100]
z = [11220, 12740]
direction = "west"
base = 6000
top = 3000
steps = 12
tread_material = "wood.stair"
[[slab]]            # half landing at the west end
