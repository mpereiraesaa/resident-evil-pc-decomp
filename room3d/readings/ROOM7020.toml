# Return-visit copy of ROOM2020.toml: stage 7 shares its collision and cameras exactly.
# Dining room gallery: the balcony ring around the dining room's void, red
# carpet, marble walls over a red panelled dado, the arched stained window
# on the west wall. The void shows the dining room far below; the 1F room runs
# on under the galleries to the outer walls (cameras 0-2 see its walls and the
# 1F east door below the gallery door), the galleries rest on wooden posts.
room = "ROOM7020"
title = "Dining room 2F (return)"
seed = 2020

[shell]
floor = 0
ceiling = -6200
floor_material = "carpet.floor"
wall_material = "marble"
ceiling_material = "plaster.ceiling"
dado = 1200
dado_material = "panel"
chair_rail = true
skirting = 200
cell = 1200

[materials]
marble = [0.72, 0.66, 0.54]
panel = [0.42, 0.11, 0.10]
"carpet.floor" = { color = [0.50, 0.12, 0.10], motif = [0.78, 0.62, 0.30], tile = [2600, 2600] }
coffer = [0.18, 0.13, 0.09]
wood = [0.24, 0.15, 0.09]
stone = [0.66, 0.62, 0.54]
checker = { color = [0.76, 0.70, 0.60], dark = [0.24, 0.18, 0.14] }
door = [0.26, 0.17, 0.10]
"panel.lower" = { color = [0.62, 0.56, 0.44], tile = [1500, 3000] }
"plaster.ceiling" = { color = [0.70, 0.64, 0.52], stains = 0.2 }

[lighting]
ambient = [0.13, 0.115, 0.09]

[[zone]]            # south strip: its wall stands at z 1700 in camera 3's view (the
box = [1732, 1700, 31986, 4050]  # camera sits at z 1890, just inside it)
floor_along = "x"
[[zone]]            # west strip
box = [1732, 4050, 4914, 13068]
[[zone]]            # east strip
box = [29178, 4050, 31986, 13068]
[[zone]]            # north strip
box = [1732, 13068, 31986, 15174]
floor_along = "x"
[[zone]]            # the void over the dining room (no shaft: the 1F room runs on
box = [4914, 4050, 29178, 13068]  # under the galleries to the outer walls)
open_floor = true

[[slab]]            # the dining room floor, the full footprint below the galleries
box = [1732, 1700, 31986, 15174]
top = 6500
thickness = 200
top_material = "checker"
bottom_material = "checker"
