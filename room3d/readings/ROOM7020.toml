# Return-visit copy of ROOM2020.toml: stage 7 shares its collision and cameras exactly.
# Dining room gallery: the balcony ring around the dining room's void, red
# carpet, marble walls over a red panelled dado, the arched stained window
# on the east wall. The void shows the dining room floor far below.
