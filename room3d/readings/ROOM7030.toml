# Return-visit copy of ROOM2030.toml: stage 7 shares its collision and cameras exactly.
# Main hall 2F: the galleries around the two-storey main hall. The RDT shares
# ROOM1060's frame (identical footprint, stair and gallery edges, the 1F floor
# 6000 below this room's floor), so this reading inherits the 1F hall reading
# moved down a storey: the cameras up here look over the balustrades into the
# real hall, its arcades, rugs and stair, instead of a walled shaft. Only the
# gallery-level doors are added here.
room = "ROOM7030"
title = "Main hall 2F (return)"
seed = 2030
base = { reading = "ROOM1060", y = 6000 }

# Gallery-level doors (door zones of ROOM2030.RDT)
[[door]]
wall = "east"
span = [7000, 9000]
bottom = 0
top = -3300
material = "door"
[[door]]
wall = "east"
span = [19000, 22000]
bottom = 0
top = -3300
material = "door"
[[door]]
wall = "west"
span = [15000, 18800]
bottom = 0
top = -3300
material = "door"

[materials]         # the upper walls read paler cream than the hall below
plaster = { color = [0.86, 0.80, 0.64], stains = 0.1 }
