# Return-visit copy of ROOM2060.toml: stage 7 shares its collision and cameras exactly.
# Small library: dark red damask over a brown dado, patterned rug on dark
# planks, a tall double-sided bookcase standing out from the east wall (block
# 8: books on its north and south faces, seen in cameras 0-3), a low dresser
# with a wicker chair on the west wall, low cabinets north and south-east (the
# latter with the lamp), a round table. From ROOM2060.RDT blocks and the circle.
room = "ROOM7060"
title = "Small library (return)"
seed = 2060

[shell]
floor = 0
ceiling = -4600
floor_material = "planks"
wall_material = "wallpaper"
ceiling_material = "plaster.dark"
dado = 900
dado_material = "panel"
chair_rail = true
skirting = 160
cell = 700

[materials]
wallpaper = { color = [0.46, 0.10, 0.14], motif = [0.62, 0.30, 0.26], repeats = 6 }
"plaster.dark" = [0.20, 0.12, 0.10]
panel = [0.26, 0.12, 0.08]
planks = [0.26, 0.14, 0.09]
wood = [0.22, 0.11, 0.07]
door = [0.26, 0.14, 0.08]
books = { color = [0.24, 0.14, 0.09], shelves = 6 }
carpet = { color = [0.52, 0.30, 0.22], motif = [0.84, 0.78, 0.66] }

[lighting]
ambient = [0.26, 0.18, 0.15]

[[zone]]
box = [2052, 1890, 9954, 12780]

[[door]]
wall = "south"
span = [2500, 3800]
top = -3300
material = "door"
[[door]]
wall = "east"
span = [10700, 12300]
top = -3300
material = "door"

[[object]]          # low west dresser (blocks 6; camera 3 stands behind the west wall beside it)
kind = "box"
box = [2052, 7398, 2718, 11988]
top = -1100
material = "wood"
omit = ["bottom", "west"]
group = "west_case"
[[object]]          # low north cabinet
kind = "box"
box = [2052, 11988, 6390, 12780]
top = -1100
material = "wood"
omit = ["bottom", "north", "west"]
[[object]]          # south-east cabinet with the lamp
kind = "box"
box = [7146, 1890, 9954, 2718]
top = -1100
material = "wood"
omit = ["bottom", "south", "east"]
[[object]]
kind = "lamp"
at = [8800, 2300]
base = -1100
height = 650
[[object]]          # tall bookcase out from the east wall, books on both long faces
kind = "bookcase"
box = [7110, 5166, 9954, 7128]
top = -3500
front = ["north", "south"]
books = "books"
[[object]]          # wicker chair beside the west dresser
kind = "chair"
at = [2950, 6900]
facing = "east"
[[object]]          # round table
kind = "cylinder"
at = [5130, 10026]
radius = 810
top = -800
bottom = -720
material = "wood"
segments = 14
[[object]]
kind = "cylinder"
at = [5130, 10026]
radius = 100
top = -720
material = "wood"
segments = 8
[[object]]
kind = "rug"
box = [3000, 3200, 8800, 11500]

[[painting]]
wall = "north"
span = [7000, 7700]
y = [-2900, -2300]
[[painting]]
wall = "north"
span = [8200, 8900]
y = [-2900, -2300]

[[light]]
at = [8800, -1900, 2300]
color = [1.0, 0.92, 0.72]
strength = 0.6
reach = 5000

[[hide]]            # camera 3 sits in the west wall, inside the bookcase footprint
camera = 3
groups = ["west_case"]
