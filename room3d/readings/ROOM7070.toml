# Return-visit copy of ROOM2070.toml: stage 7 shares its collision and cameras exactly.
# 2F left stairs: tan plaster over a dark dado, planks with a runner, a long
# corridor east with paintings and doors. North of its west end a two-storey
# stair hall (blocks 8/9 are its void and the lower flight): the upper flight
# runs north from the corridor edge (x 8640-10332) down to a half landing in
# the north-east corner, the lower flight turns west along the north wall down
# to the 1F floor in six tall steps; a chandelier hangs on a long rod into the hall. Camera 0
# stands in the hall at 2F floor height. The upper flight's banister is stepped
# (no sloped rail for north/south flights); the 1F door camera 0 sees under the
# lower flight is left out (it does not fit under the flight as modelled).
room = "ROOM7070"
title = "2F left stairs (return)"
seed = 2070

[shell]
floor = 0
ceiling = -4800
floor_material = "planks"
wall_material = "plaster"
ceiling_material = "plaster.dark"
dado = 1100
dado_material = "panel"
chair_rail = true
skirting = 180
cell = 800

[materials]
plaster = { color = [0.72, 0.58, 0.40], stains = 0.3 }
"plaster.dark" = [0.28, 0.22, 0.16]
panel = [0.30, 0.15, 0.09]
planks = [0.30, 0.17, 0.10]
runner = { color = [0.30, 0.22, 0.26], motif = [0.60, 0.52, 0.40] }
wood = [0.30, 0.12, 0.08]
door = [0.26, 0.16, 0.10]
"door.dark" = [0.12, 0.14, 0.16]
glass_dark = [0.10, 0.13, 0.18]
"plaster.dim" = [0.17, 0.11, 0.07]

[lighting]
ambient = [0.13, 0.11, 0.08]

[[zone]]            # west leg
box = [1890, 2914, 3870, 10710]
[[zone]]            # long corridor
box = [1890, 10710, 20000, 12582]
floor_along = "x"
[[zone]]            # long corridor, east half: the north wall stands a little
box = [20000, 10710, 31302, 13100]  # behind the collision edge (camera 6 sits at z 12600)
floor_along = "x"
[[zone]]            # east leg
box = [29574, 4194, 31302, 10710]
[[zone]]            # the stair hall: open from the 2F down to the 1F floor
box = [1890, 12582, 10332, 20124]
open_floor = true
depth = 3600
shaft_material = "plaster"

[[slab]]            # 1F floor of the stair hall
box = [1890, 12582, 10332, 20124]
top = 3600
thickness = 200
top_material = "planks"
bottom_material = "planks"
[[slab]]            # half landing in the north-east corner of the hall
box = [6400, 17856, 10332, 20124]
top = 2000
thickness = 250
top_material = "planks"
bottom_material = "plaster"
edges = ["south", "west"]
edge_material = "wood"

[[object]]
kind = "rug"
box = [4500, 11200, 29000, 12100]
material = "runner"

# Upper flight: from the corridor edge north down to the half landing
[[stair]]
x = [8640, 10332]
z = [12582, 17856]
direction = "south"
base = 2000
top = 0
steps = 13
tread_material = "wood"
# Lower flight: from the half landing west down to the 1F floor, open on the south
[[stair]]
x = [3132, 6400]
z = [17856, 20124]
direction = "east"
base = 3600
top = 2000
steps = 6
tread_material = "wood"
rails = [{ side = "south" }]
# Solid string under the upper flight (stepped), the 1F wall beneath it
