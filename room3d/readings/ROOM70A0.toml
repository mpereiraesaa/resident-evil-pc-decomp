# Return-visit copy of ROOM20A0.toml: stage 7 shares its collision and cameras exactly.
# Study: dark teal damask wallpaper under a deep dark cornice, dark boards, a
# brass chandelier. The insect display case (gilt frame, pale ground) hangs
# on the south wall near the south-west corner; the desk with its lamp and
# the chair stand against the south wall further east under two small
# portraits; one small wall cabinet on the north wall; the door on the west
# wall with a coat hanging by the north-west corner pilaster. The visible
# walls sit a little outside the collision blocks (north ~8500, east ~7950,
# south ~1500, found by triangulating corners and the cabinet from cameras 0
# and 1). Cameras 3-5 repeat 0-2; cameras 2/5 are the close look at the
# insect case and keep the original.
room = "ROOM70A0"
title = "Study (return)"
seed = 2100
backdrop = [2, 5]

[shell]
floor = 0
ceiling = -5000
floor_material = "planks"
wall_material = "wallpaper"
ceiling_material = "plaster.dark"
skirting = 200
cornice = 380
trim = "wood"
cell = 600

[materials]
wallpaper = { color = [0.13, 0.23, 0.25], motif = [0.07, 0.13, 0.15], repeats = 7 }
"plaster.dark" = [0.20, 0.14, 0.10]
"plaster.case" = { color = [0.56, 0.56, 0.58], stains = 0.7 }
planks = [0.15, 0.07, 0.05]
wood = [0.30, 0.20, 0.10]
"wood.cabinet" = [0.26, 0.15, 0.09]
linen = [0.62, 0.62, 0.52]
door = [0.14, 0.13, 0.16]

[lighting]
ambient = [0.08, 0.10, 0.11]

[[zone]]
box = [2056, 1500, 7950, 8500]

[[door]]
wall = "west"
span = [4740, 6430]
top = -3550
material = "door"

[[object]]          # desk (block 7) with its lamp, chair in front (block 5)
kind = "table"
box = [4914, 1500, 7704, 2592]
top = -1300
thickness = 100
[[object]]
kind = "lamp"
at = [6000, 2200]
base = -1300
height = 650
[[object]]
kind = "chair"
at = [6400, 2950]
facing = "south"
seat = "wood"
[[painting]]        # two small portraits above the desk
wall = "south"
span = [5850, 6650]
y = [-3400, -2800]
[[painting]]
wall = "south"
span = [5850, 6650]
y = [-2600, -1950]

[[painting]]        # insect display case
wall = "south"
span = [2300, 5300]
y = [-3200, -1650]
material = "plaster.case"

[[object]]          # small wall cabinet on the north wall
kind = "box"
box = [4650, 8250, 5580, 8500]
top = -3000
bottom = -1600
material = "wood.cabinet"
[[object]]          # pilaster in the north-west corner
kind = "box"
box = [2056, 7900, 2500, 8500]
top = -5000
material = "wallpaper"
omit = ["bottom", "top"]
[[object]]          # coat hanging by the pilaster
kind = "box"
box = [2550, 7450, 2850, 7850]
top = -3450
bottom = -2000
material = "linen"

[[chandelier]]
at = [4900, 5000]
y = -3900
radius = 380
globes = 3
globe_radius = 130
ceiling = -5000
strength = 0.40
reach = 6000
[[light]]
at = [6000, -1700, 2200]
color = [1.0, 0.95, 0.80]
strength = 0.35
reach = 3500
