# Mansion piano room and the ruined passage behind it (return visit).
# Piano room (cameras 0-3): beige panelled walls between dark wood pilasters
# over a dark wood dado, a pale ornamented ceiling with a carved frieze and a
# brass chandelier, a large green-black and white checker floor. Green marble
# fireplace with brick interior on the east wall, a red door near the east
# wall's north end, a black upright piano in the south-west corner, a small
# table and chairs in the south-east corner, paintings and wall lamps.
# Ruined passage (cameras 4-7): peeling plaster over ochre brick with ivy, a
# mossy floor with a stone-lined hatch and ladder down.
# From ROOM70C0.RDT collision and its eight backgrounds.
