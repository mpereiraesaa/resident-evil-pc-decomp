# Return-visit copy of ROOM20E0.toml: stage 7 shares its collision and cameras exactly.
# Front of attic: pale plaster with arched panels over a dark dado, dark
# tiles, a short stair up to the wooden attic door on the east, a narrow leg
# north to another door. From ROOM20E0.RDT blocks and the stair rectangle.
room = "ROOM70E0"
title = "Front of attic (return)"
seed = 2140

[shell]
floor = 0
ceiling = -4600
floor_material = "marble.dark"
wall_material = "plaster"
ceiling_material = "plaster.dark"
dado = 1000
dado_material = "panel"
chair_rail = true
skirting = 120
cell = 700

[materials]
plaster = { color = [0.66, 0.64, 0.58], stains = 0.3 }
"plaster.dark" = [0.18, 0.17, 0.15]
"marble.dark" = { color = [0.24, 0.14, 0.14], tile = [1400, 1400] }
panel = [0.26, 0.15, 0.09]
wood = [0.30, 0.18, 0.10]
door = [0.46, 0.28, 0.14]
"door.dark" = [0.24, 0.14, 0.09]

[lighting]
ambient = [0.12, 0.11, 0.09]

[[zone]]            # south area (south wall set back from the collision line at 1944 so
                    # camera 1, which stands against it, does not clip it at the near plane)
box = [1932, 1300, 9990, 3978]
floor_along = "x"
[[zone]]            # narrow leg north (east wall widened past the collision line at 5724
                    # for the same reason: camera 3 hugs it)
box = [4428, 3978, 6000, 14526]

[[door]]
wall = "west"
span = [2500, 3900]
top = -3300
material = "door.dark"
[[door]]
wall = "west"
span = [11400, 13000]
top = -3300
material = "door.dark"
[[door]]
wall = "east"
span = [2500, 3800]
top = -4300
bottom = -1200
material = "door"

[[stair]]
