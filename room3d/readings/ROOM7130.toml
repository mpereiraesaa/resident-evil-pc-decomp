# Mansion 2F passage (return visit): white plaster heavily stained grey and
# ochre, tall polished red-wood skirting, dark red planks, a dark teal ceiling,
# black iron lantern sconces. A long north-south leg along x 15498-17532 with
# a blue door and the ornate wooden lift gate on its west side and red
# curtains on its east wall, a wider bay at its middle, a south leg west to a
# door, and a west leg ending at a carved door. From ROOM7130.RDT collision
# and its seven backgrounds.
