# north wall, lockers and a glazed shelf unit on the west wall, a microwave on
# a steel trolley, a two-door steel fridge against the central block, and the
# red-caged service elevator on that block's east face. Doors: red-framed one
# on the south wall (locked), one in the north-west alcove.
